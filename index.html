<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Holiday Lights by [Your Name]</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #002b36, #073642);
      color: #fff;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      padding: 2em;
      background: #b58900;
      color: #002b36;
    }
    h1 {
      margin: 0;
      font-size: 2.5em;
    }
    .content {
      padding: 2em;
    }
    form {
      background: #073642;
      padding: 2em;
      border-radius: 10px;
      max-width: 500px;
      margin: 0 auto;
    }
    input, textarea, select {
      width: 100%;
      padding: 1em;
      margin: 0.5em 0;
      border-radius: 5px;
      border: none;
    }
    button {
      background: #b58900;
      color: #002b36;
      padding: 1em 2em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
    }
    footer {
      margin-top: 2em;
      padding: 1em;
      background: #002b36;
      font-size: 0.9em;
    }
    a {
      color: #cb4b16;
    }
  </style>
</head>
<body>

  <header>
    <h1>Holiday Light Installation</h1>
    <p>Make your home sparkle this season!</p>
  </header>

  <div class="content">
    <h2>Schedule Your Installation</h2>
    <p>Fill out the form below and we’ll confirm your appointment.</p>

    <!-- Replace the action with your form service or backend -->
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <input type="text" name="name" placeholder="Your Name" required />
      <input type="email" name="email" placeholder="Your Email" required />
      <input type="tel" name="phone" placeholder="Your Phone Number" required />
      <label for="date">Preferred Date:</label>
      <input type="date" name="date" required />
      <label for="time">Preferred Time:</label>
      <input type="time" name="time" required />
      <textarea name="notes" rows="4" placeholder="Any additional details..."></textarea>
      <button type="submit">Request Appointment</button>
    </form>

    <p>Prefer to call or text? Reach us at <strong><a href="tel:9168396659">(916) 839-6659</a></strong></p>
  </div>

  <footer>
    &copy; 2025 Holiday Lights by [Your Name]. All rights reserved.
  </footer>

</body>
</html>
